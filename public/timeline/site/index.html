<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life Timeline</title>
    <script src="shared/boot.js"></script>
    <link rel="stylesheet" href="shared/shell.css" />
    <!-- Prototype: reads ../dist/career.public.js (built by tools/build.py). Media frames are dummies until real photos exist. -->
    <style id="classic-css">
      :root {
        --bg: #07080d;
        --bg-2: #0d0f18;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-2: rgba(255, 255, 255, 0.07);
        --line: rgba(255, 255, 255, 0.1);
        --line-2: rgba(255, 255, 255, 0.18);
        --text: #f4f6fb;
        --muted: #aab3c5;
        --soft: #8a93a8;
        --accent: #8b5cf6;
        --accent-ink: #c4b5fd;
        --accent-soft: rgba(139, 92, 246, 0.28);
        --shadow: 0 24px 80px -32px rgba(0, 0, 0, 0.8);
        --radius: 18px;
        --radius-sm: 12px;
        --font:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #f5f1ea;
        --bg-2: #ece6dc;
        --surface: #fffdf9;
        --surface-2: #fbf7f0;
        --line: rgba(60, 40, 20, 0.12);
        --line-2: rgba(60, 40, 20, 0.22);
        --text: #1d1a16;
        --muted: #554d44;
        --soft: #6f665c;
        --accent: #6d28d9;
        --accent-ink: #5b21b6;
        --accent-soft: rgba(109, 40, 217, 0.14);
        --shadow: 0 18px 50px -24px rgba(70, 45, 20, 0.35);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font);
        color: var(--text);
        background: var(--bg);
        min-height: 100svh;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }
      /* Atmosphere: chapter hue drives two soft pools of light behind everything. */
      .atmos {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        transition: background 1.2s ease;
      }
      :root:not([data-theme="light"]) .atmos {
        background:
          radial-gradient(60vw 50vh at 18% 8%, hsl(var(--hue) 70% 45% / 0.22), transparent 70%),
          radial-gradient(
            50vw 45vh at 90% 85%,
            hsl(calc(var(--hue) + 40) 70% 40% / 0.14),
            transparent 70%
          ),
          linear-gradient(180deg, var(--bg-2), var(--bg));
      }
      :root[data-theme="light"] .atmos {
        background:
          radial-gradient(60vw 50vh at 18% 8%, hsl(var(--hue) 60% 80% / 0.45), transparent 70%),
          radial-gradient(
            50vw 45vh at 90% 85%,
            hsl(calc(var(--hue) + 40) 50% 85% / 0.4),
            transparent 70%
          ),
          linear-gradient(180deg, var(--bg), var(--bg-2));
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 0 8px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        flex-direction: column;
      }
      .brand small {
        color: var(--soft);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 600;
      }
      .brand b {
        font-family: var(--serif);
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .seg button,
      .icon-btn {
        font: inherit;
        font-size: 0.8rem;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          color 0.2s,
          background 0.2s;
      }
      .seg button[aria-pressed="true"] {
        color: var(--text);
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      .seg button:hover,
      .icon-btn:hover {
        color: var(--text);
      }
      .seg-label {
        font-size: 0.7rem;
        color: var(--soft);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-right: 4px;
      }
      .icon-btn {
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 7px 12px;
      }
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Stage */
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 40px;
        align-items: center;
        padding: 28px 0 24px;
        min-height: 62svh;
      }
      .chapter-meta {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .kicker {
        color: var(--accent-ink);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
      h1.place {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(2.4rem, 5.4vw, 4.4rem);
        line-height: 1;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .years {
        color: var(--muted);
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
      }
      .lede {
        color: var(--muted);
        max-width: 46ch;
        margin: 0;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 0.75rem;
        color: var(--muted);
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 3px 10px;
        border-radius: 999px;
      }
      .chip b {
        color: var(--text);
        font-weight: 600;
      }
      .cards {
        display: grid;
        gap: 10px;
        margin-top: 4px;
      }
      .card {
        text-align: left;
        font: inherit;
        color: inherit;
        width: 100%;
        cursor: pointer;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        transition:
          transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
          border-color 0.25s;
      }
      :root:not([data-theme="light"]) .card {
        box-shadow: none;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: var(--line-2);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--c, var(--soft));
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, var(--soft)) 18%, transparent);
      }
      .card .t {
        font-weight: 600;
        font-size: 0.95rem;
        display: block;
      }
      .card .s {
        color: var(--soft);
        font-size: 0.8rem;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .y {
        color: var(--soft);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }
      .card.placeholder {
        border-style: dashed;
      }
      .badge {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 2px 7px;
        border-radius: 6px;
        border: 1px dashed var(--accent);
        color: var(--accent-ink);
        margin-left: 6px;
        vertical-align: 2px;
      }
      .more {
        font: inherit;
        font-size: 0.82rem;
        color: var(--accent-ink);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 4px 0;
        justify-self: start;
      }

      /* Media frame (three switchable looks) */
      .media {
        position: relative;
        aspect-ratio: 16 / 10;
      }
      .frame {
        position: absolute;
        inset: 0;
        border-radius: var(--radius);
        overflow: hidden;
        opacity: 0;
        transition:
          opacity 1.4s ease,
          transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        background:
          radial-gradient(
            120% 80% at var(--fx, 30%) var(--fy, 20%),
            hsl(var(--h) 75% 62% / 0.9),
            transparent 60%
          ),
          radial-gradient(
            90% 70% at 80% 90%,
            hsl(calc(var(--h) + 50) 70% 42% / 0.9),
            transparent 65%
          ),
          linear-gradient(160deg, hsl(var(--h) 45% 22%), hsl(calc(var(--h) + 30) 50% 12%));
      }
      .frame.on {
        opacity: 1;
      }
      .frame .scene {
        position: absolute;
        inset: -6%;
        animation: kb 14s ease-in-out infinite alternate;
      }
      .frame svg {
        position: absolute;
        inset: auto 0 0 0;
        width: 100%;
        height: 55%;
      }
      .frame .cap {
        position: absolute;
        left: 14px;
        bottom: 12px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
      }
      .frame .cap span {
        background: rgba(8, 8, 14, 0.62);
        padding: 4px 9px;
        border-radius: 7px;
        backdrop-filter: blur(6px);
      }
      .frame .slot {
        position: absolute;
        top: 14px;
        left: 14px;
        font-size: 0.7rem;
        color: #fff;
        background: rgba(8, 8, 14, 0.62);
        border: 1px dashed rgba(255, 255, 255, 0.5);
        padding: 3px 8px;
        border-radius: 7px;
        letter-spacing: 0.06em;
      }
      @keyframes kb {
        from {
          transform: scale(1) translate(0, 0);
        }
        to {
          transform: scale(1.08) translate(-2%, -1.5%);
        }
      }

      /* Cinema: full-bleed with letterbox bars and a soft vignette blending into the page */
      [data-frame="cinema"] .media {
        aspect-ratio: 21 / 11;
      }
      [data-frame="cinema"] .frame::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 90px 10px rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }
      [data-frame="cinema"] .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        border-top: 18px solid rgba(0, 0, 0, 0.55);
        border-bottom: 18px solid rgba(0, 0, 0, 0.55);
      }
      [data-frame="cinema"] .frame .cap {
        bottom: 26px;
      }
      [data-frame="cinema"] .frame .slot {
        top: 26px;
      }

      /* Polaroid stack: every frame visible, fanned; active one on top */
      [data-frame="polaroid"] .media {
        aspect-ratio: 5 / 4;
        max-width: 520px;
        margin: 0 auto;
        width: 100%;
      }
      [data-frame="polaroid"] .frame {
        opacity: 1;
        inset: 6% 12% 10% 12%;
        border-radius: 6px;
        border: 12px solid #fbf8f2;
        border-bottom-width: 44px;
        box-shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.6);
      }
      [data-frame="polaroid"] .frame:nth-child(1) {
        transform: rotate(-7deg) translate(-8%, 2%);
      }
      [data-frame="polaroid"] .frame:nth-child(2) {
        transform: rotate(5deg) translate(9%, -1%);
      }
      [data-frame="polaroid"] .frame:nth-child(3) {
        transform: rotate(-1deg);
      }
      [data-frame="polaroid"] .frame.on {
        z-index: 3;
        transform: rotate(0deg) scale(1.03);
      }
      [data-frame="polaroid"] .media:hover .frame:nth-child(1) {
        transform: rotate(-12deg) translate(-20%, 4%);
      }
      [data-frame="polaroid"] .media:hover .frame:nth-child(2) {
        transform: rotate(10deg) translate(20%, -2%);
      }
      [data-frame="polaroid"] .frame .cap {
        bottom: -34px;
        color: #3b342c;
      }
      [data-frame="polaroid"] .frame .cap span {
        background: none;
        backdrop-filter: none;
        padding: 0;
        font-family: var(--serif);
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.9rem;
      }

      /* Film strip: frames side by side on a moving strip with sprocket holes */
      [data-frame="film"] .media {
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: var(--radius);
        background: #0b0b10;
        padding: 26px 0;
      }
      [data-frame="film"] .media::before,
      [data-frame="film"] .media::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 14px;
        z-index: 2;
        background: repeating-linear-gradient(
          90deg,
          transparent 0 10px,
          rgba(255, 255, 255, 0.75) 10px 22px,
          transparent 22px 34px
        );
        -webkit-mask: linear-gradient(transparent 3px, #000 3px, #000 11px, transparent 11px);
        mask: linear-gradient(transparent 3px, #000 3px, #000 11px, transparent 11px);
      }
      [data-frame="film"] .media::before {
        top: 6px;
      }
      [data-frame="film"] .media::after {
        bottom: 6px;
      }
      [data-frame="film"] .strip {
        position: absolute;
        inset: 26px 0;
        display: flex;
        gap: 10px;
        transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
      }
      [data-frame="film"] .frame {
        position: relative;
        inset: auto;
        flex: 0 0 78%;
        opacity: 0.55;
        border-radius: 4px;
      }
      [data-frame="film"] .frame.on {
        opacity: 1;
      }
      .strip {
        position: absolute;
        inset: 0;
      }

      /* Scrubber */
      .scrub {
        position: sticky;
        bottom: 0;
        z-index: 5;
        padding: 28px 0 18px;
        background: var(--bg);
        box-shadow: 0 0 0 100vmax var(--bg);
        clip-path: inset(0 -100vmax);
      }
      .scrub-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .track {
        position: relative;
        flex: 1;
        height: 64px;
        touch-action: none;
        cursor: pointer;
      }
      .track .rail {
        position: absolute;
        left: 0;
        right: 0;
        top: 30px;
        height: 2px;
        background: var(--line-2);
        border-radius: 2px;
      }
      .track .fill {
        position: absolute;
        left: 0;
        top: 30px;
        height: 2px;
        background: var(--accent);
        border-radius: 2px;
      }
      .node {
        position: absolute;
        top: 22px;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        border-radius: 50%;
        border: 2px solid var(--line-2);
        background: var(--bg);
        cursor: pointer;
        padding: 0;
        transition:
          transform 0.3s,
          border-color 0.3s,
          background 0.3s;
      }
      .node.past {
        border-color: var(--accent);
      }
      .node.active {
        background: var(--accent);
        border-color: var(--accent);
        transform: scale(1.25);
        box-shadow: 0 0 0 6px var(--accent-soft);
      }
      .node span {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.72rem;
        color: var(--soft);
        white-space: nowrap;
      }
      .node.active span {
        color: var(--text);
        font-weight: 600;
      }
      .node.up span {
        top: -22px;
      }
      .yearmarks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 14px;
      }
      .yearmarks i {
        position: absolute;
        top: 4px;
        width: 1px;
        height: 8px;
        background: var(--line);
      }
      .yearmarks i.dec {
        height: 12px;
        top: 0;
        background: var(--line-2);
      }
      .handle {
        position: absolute;
        top: 18px;
        width: 4px;
        height: 26px;
        margin-left: -2px;
        border-radius: 3px;
        background: var(--text);
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .track.dragging .handle {
        opacity: 0.9;
      }
      .yearpop {
        position: absolute;
        top: -14px;
        transform: translateX(-50%);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        background: var(--surface-2);
        border: 1px solid var(--line);
        padding: 1px 7px;
        border-radius: 6px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .track.dragging .yearpop {
        opacity: 1;
      }
      .nav {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 1.1rem;
        flex: none;
      }
      .nav:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .hint {
        color: var(--soft);
        font-size: 0.78rem;
        text-align: center;
        margin-top: 8px;
      }

      /* Drawer */
      .drawer-bg {
        position: fixed;
        inset: 0;
        background: rgba(5, 5, 10, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 10;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(460px, 100vw);
        background: var(--bg-2);
        border-left: 1px solid var(--line);
        z-index: 11;
        transform: translateX(102%);
        transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        overflow-y: auto;
        padding: 26px 26px 40px;
      }
      :root[data-theme="light"] .drawer {
        background: var(--surface);
      }
      .open .drawer {
        transform: none;
      }
      .open .drawer-bg {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer h2 {
        font-family: var(--serif);
        font-size: 1.6rem;
        line-height: 1.15;
        margin: 8px 0 4px;
      }
      .drawer h3 {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--soft);
        margin: 22px 0 8px;
      }
      .drawer p,
      .drawer li {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .drawer ul {
        padding-left: 18px;
        margin: 0;
      }
      .metric {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .metric b {
        font-size: 1.05rem;
        color: var(--text);
        min-width: 7ch;
      }
      .metric small {
        color: var(--soft);
      }
      .unv {
        font-size: 0.65rem;
        color: #f59e0b;
        border: 1px solid currentColor;
        border-radius: 5px;
        padding: 0 5px;
        margin-left: 6px;
      }
      .close {
        position: absolute;
        top: 16px;
        right: 16px;
      }

      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 0.75rem;
        color: var(--soft);
        padding-bottom: 28px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      @media (max-width: 860px) {
        .scrub {
          padding: 10px 0 6px;
        }
        .scrub .hint {
          display: none;
        }
        .wrap {
          padding: 0 16px;
        }
        .stage {
          grid-template-columns: 1fr;
          gap: 22px;
          padding-top: 14px;
          min-height: 0;
        }
        .node span {
          display: none;
        }
        .node.active span {
          display: block;
        }
        .seg-label {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .frame .scene {
          animation: none;
        }
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script>
      /* other designs: switch classic's stylesheet off before paint */ if (
        document.documentElement.dataset.design !== "classic"
      )
        document.getElementById("classic-css").disabled = true;
    </script>
  </head>
  <body>
    <div class="atmos classic-only" aria-hidden="true"></div>
    <div id="design-root"></div>
    <div class="wrap classic-only">
      <header class="top">
        <div class="brand">
          <small>Life timeline · prototype</small><b id="who">Akshay Borse</b>
        </div>
        <div class="controls">
          <div class="seg" role="group" aria-label="Frame style">
            <span class="seg-label" style="align-self: center; padding-left: 8px">Frame</span>
            <button data-set="frame" data-v="cinema">Cinema</button
            ><button data-set="frame" data-v="polaroid">Polaroid</button
            ><button data-set="frame" data-v="film">Film strip</button>
          </div>
          <div class="seg" role="group" aria-label="Chapter transition">
            <span class="seg-label" style="align-self: center; padding-left: 8px">Change</span>
            <button data-set="trans" data-v="fade">Fade</button
            ><button data-set="trans" data-v="slide">Slide</button
            ><button data-set="trans" data-v="zoom">Zoom</button>
          </div>
          <button class="icon-btn" id="theme" aria-label="Toggle light or dark theme">
            ◐ Theme
          </button>
        </div>
      </header>

      <main>
        <section class="stage" id="stage" aria-live="polite">
          <div class="media" id="media"><div class="strip" id="strip"></div></div>
          <div class="chapter-meta" id="meta"></div>
        </section>

        <section class="scrub" aria-label="Timeline">
          <div class="scrub-row">
            <button class="nav" id="prev" aria-label="Previous chapter">‹</button>
            <div class="track" id="track" role="slider" tabindex="0" aria-label="Year">
              <div class="yearmarks" id="marks"></div>
              <div class="rail"></div>
              <div class="fill" id="fill"></div>
              <div class="handle" id="handle"></div>
              <div class="yearpop" id="yearpop"></div>
            </div>
            <button class="nav" id="next" aria-label="Next chapter">›</button>
          </div>
          <p class="hint">
            Drag the timeline, click a city, or use ← → keys. Frames are placeholders until real
            photos are added.
          </p>
        </section>
        <div class="legend" id="legend"></div>
      </main>
    </div>

    <div class="drawer-bg classic-only" id="drawerBg"></div>
    <aside class="drawer classic-only" id="drawer" aria-label="Details" tabindex="-1">
      <button class="icon-btn close" id="close">Close</button>
      <div id="drawerBody"></div>
    </aside>

    <script src="../dist/career.public.js"></script>
    <script src="shared/shell.js"></script>
    <script>
      (() => {
        if (document.documentElement.dataset.design !== "classic") return; // another design is active
        const data = window.CAREER;
        if (!data) {
          document.body.innerHTML =
            '<p style="padding:40px;font-family:sans-serif">No data: run <code>python tools/build.py</code> first.</p>';
          console.error("career.public.js missing");
          return;
        }
        const E = data.entries,
          byId = Object.fromEntries(E.map((e) => [e.id, e]));
        const TYPE = {
          role: ["Work", "#8b5cf6"],
          education: ["Education", "#22d3ee"],
          project: ["Project", "#2dd4bf"],
          achievement: ["Achievement", "#f59e0b"],
          story: ["Story", "#f472b6"],
          "life-event": ["Turning point", "#94a3b8"],
          talk: ["Talk", "#60a5fa"],
          publication: ["Publication", "#60a5fa"],
          volunteering: ["Volunteering", "#a3e635"],
          vision: ["Vision", "#c4b5fd"],
        };
        const ORDER = [
          "life-event",
          "education",
          "role",
          "achievement",
          "publication",
          "talk",
          "project",
          "volunteering",
          "story",
          "vision",
        ];
        const num = (s) =>
          s
            ? +String(s).slice(0, 4) +
              (String(s).length >= 7 ? (+String(s).slice(5, 7) - 1) / 12 : 0)
            : null;
        const NOW = new Date().getFullYear() + new Date().getMonth() / 12;
        const fmt = (s) =>
          !s
            ? ""
            : s === "present"
              ? "now"
              : s.length >= 7
                ? new Date(+s.slice(0, 4), +s.slice(5, 7) - 1).toLocaleString("en", {
                    month: "short",
                  }) +
                  " " +
                  s.slice(0, 4)
                : s;
        const span = (e) =>
          e.start ? fmt(e.start) + (e.end && e.end !== e.start ? " – " + fmt(e.end) : "") : "";
        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );

        // An undated project or story inherits the start of the first dated entry it links to (usually its role).
        const when = (e, seen = new Set()) => {
          if (e.start) return num(e.start);
          for (const r of e.related || []) {
            const x = byId[r];
            if (x && !seen.has(r)) {
              seen.add(r);
              const w = when(x, seen);
              if (w != null) return w;
            }
          }
          return null;
        };
        const shown = E.filter((e) => TYPE[e.type] && !e.possible_duplicate_of);

        // Chapters begin at every city move / big transition (the user's turning points).
        const turns = E.filter(
          (e) => e.type === "life-event" && e.start && /^city-/.test(e.id)
        ).sort((a, b) => num(a.start) - num(b.start));
        const place = (t) =>
          t.title
            .replace(/^Moved to /, "")
            .replace(/^Transition to /, "")
            .split(",")[0];
        const chapters = turns.map((t, i) => ({
          t,
          from: num(t.start),
          to: turns[i + 1] ? num(turns[i + 1].start) : NOW,
          name: place(t),
          region: (t.title.split(",")[1] || "").trim(),
          items: [],
        }));
        const epilogue = {
          name: "Beyond the timeline",
          region: "Undated · vision",
          from: NOW,
          to: NOW,
          items: [],
          epi: true,
        };
        for (const e of shown) {
          const w = when(e);
          const c =
            w == null ? epilogue : chapters.findLast((c) => c.from <= w + 1e-6) || chapters[0];
          e._w = w;
          e._inferred = !e.start && w != null;
          c.items.push(e);
        }
        if (epilogue.items.length) chapters.push(epilogue);
        chapters.forEach((c, i) => {
          c.hue = (250 + i * 37) % 360;
          c.items.sort(
            (a, b) => ORDER.indexOf(a.type) - ORDER.indexOf(b.type) || (a._w ?? 0) - (b._w ?? 0)
          );
        });

        const minY = Math.floor(chapters[0].from),
          maxY = Math.ceil(NOW) + 1;
        const pct = (y) => ((y - minY) / (maxY - minY)) * 100;
        const chapterX = (c) => (c.epi ? 100 : pct(c.from));

        // Legend
        document.getElementById("legend").innerHTML =
          Object.entries(TYPE)
            .map(([, [n, c]]) => `<span><i class="dot" style="--c:${c}"></i>${n}</span>`)
            .join("") +
          `<span><span class="badge" style="margin:0">Placeholder</span> dummy entry for layout</span>`;

        // Year ticks + nodes
        const marks = document.getElementById("marks"),
          track = document.getElementById("track");
        for (let y = minY; y <= maxY; y++)
          marks.insertAdjacentHTML(
            "beforeend",
            `<i class="${y % 5 === 0 ? "dec" : ""}" style="left:${pct(y)}%" title="${y}"></i>`
          );
        chapters.forEach((c, i) => {
          const b = document.createElement("button");
          b.className = "node";
          b.style.left = chapterX(c) + "%";
          b.setAttribute("aria-label", `${c.name}, from ${Math.floor(c.from)}`);
          b.innerHTML = `<span>${esc(c.epi ? "Beyond" : c.name)}</span>`;
          if (i && chapterX(c) - chapterX(chapters[i - 1]) < 5) b.classList.add("up"); // close neighbours: label above
          b.addEventListener("click", (ev) => {
            ev.stopPropagation();
            go(i);
          });
          c.node = b;
          track.appendChild(b);
        });

        // Settings (frame look, transition, theme) remembered per viewer.
        const store = {
          get: (k) => {
            try {
              return localStorage.getItem("lt." + k);
            } catch {
              return null;
            }
          },
          set: (k, v) => {
            try {
              localStorage.setItem("lt." + k, v);
            } catch {}
          },
        };
        const state = {
          i: 0,
          frame: store.get("frame") || "cinema",
          trans: store.get("trans") || "slide",
          expanded: false,
        };
        const root = document.documentElement;
        const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
        root.dataset.theme = store.get("theme") || (sysDark ? "dark" : "light");
        document.getElementById("theme").onclick = () => {
          root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
          store.set("theme", root.dataset.theme);
        };
        const syncSeg = () =>
          document
            .querySelectorAll("[data-set]")
            .forEach((b) => b.setAttribute("aria-pressed", state[b.dataset.set] === b.dataset.v));
        document.querySelectorAll("[data-set]").forEach(
          (b) =>
            (b.onclick = () => {
              state[b.dataset.set] = b.dataset.v;
              store.set(b.dataset.set, b.dataset.v);
              syncSeg();
              if (b.dataset.set === "frame") {
                root.dataset.frame = state.frame;
                renderMedia();
              }
            })
        );
        root.dataset.frame = state.frame;
        syncSeg();

        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const media = document.getElementById("media"),
          strip = document.getElementById("strip"),
          meta = document.getElementById("meta");

        // Abstract horizon silhouettes so each dummy frame reads as "a photo goes here" without faking a real place.
        const hills = (seed) => {
          let d = "M0 100 ";
          for (let x = 0; x <= 100; x += 10)
            d += `L${x} ${55 + 25 * Math.sin(seed * 1.7 + x / 13) + 8 * Math.sin(seed + x / 5)} `;
          return d + "L100 100Z";
        };
        let frameIdx = 0,
          frameTimer = null;
        function renderMedia() {
          const c = chapters[state.i];
          strip.innerHTML = [0, 1, 2]
            .map(
              (k) => `
      <div class="frame${k === frameIdx ? " on" : ""}" style="--h:${(c.hue + k * 22) % 360};--fx:${20 + k * 30}%;--fy:${15 + k * 10}%">
        <div class="scene"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="${hills(state.i * 3 + k)}" fill="rgba(0,0,0,.28)"/><path d="${hills(state.i * 3 + k + 9).replace(/ (\d+(\.\d+)?) /g, (m, n) => " " + (+n + 12).toFixed(1) + " ")}" fill="rgba(0,0,0,.42)"/></svg></div>
        <span class="slot">Photo slot ${k + 1} of 3</span>
        <div class="cap"><span>${esc(c.name)}${c.epi ? "" : " · " + Math.floor(c.from)}</span><span>${["Arrival", "Everyday", "Milestone"][k]}</span></div>
      </div>`
            )
            .join("");
          positionStrip();
        }
        function positionStrip() {
          const fr = [...strip.children];
          fr.forEach((f, k) => f.classList.toggle("on", k === frameIdx));
          strip.style.transform =
            state.frame === "film" && fr[0]
              ? `translateX(calc(11% - ${frameIdx} * (${fr[0].offsetWidth}px + 10px)))`
              : "";
        }
        const cycle = () => {
          frameIdx = (frameIdx + 1) % 3;
          positionStrip();
        };
        const startCycle = () => {
          clearInterval(frameTimer);
          if (!reduce) frameTimer = setInterval(() => !document.hidden && cycle(), 4800);
        };
        media.addEventListener("click", cycle);
        addEventListener("resize", positionStrip);

        function card(e) {
          const [, col] = TYPE[e.type];
          return `<button class="card${e.placeholder ? " placeholder" : ""}" data-id="${esc(e.id)}">
      <i class="dot" style="--c:${col}"></i>
      <span style="min-width:0"><span class="t">${esc(e.title)}${e.placeholder ? '<span class="badge">Placeholder</span>' : ""}</span>
      <span class="s">${esc([e.org, e.summary].filter(Boolean).join(" — "))}</span></span>
      <span class="y">${esc(span(e) || (e._inferred ? "≈" + Math.floor(e._w) : ""))}</span></button>`;
        }
        function renderMeta() {
          const c = chapters[state.i],
            items = c.items.filter((e) => e.type !== "life-event" || !/^city-/.test(e.id));
          const counts = {};
          items.forEach((e) => (counts[e.type] = (counts[e.type] || 0) + 1));
          const lim = state.expanded ? items.length : 5;
          const yrs = c.epi
            ? "Undated entries and the vision"
            : `${Math.floor(c.from)} – ${c.to >= NOW - 0.01 ? "now" : Math.floor(c.to)}`;
          const exp = data.meta.experience;
          meta.innerHTML = `
      <span class="kicker">Chapter ${state.i + 1} of ${chapters.length}${c.region ? " · " + esc(c.region) : ""}</span>
      <h1 class="place">${esc(c.name)}</h1>
      <span class="years">${yrs}</span>
      ${c.t ? `<p class="lede">${esc(c.t.summary || "")}</p>` : ""}
      <div class="chips">${Object.entries(counts)
        .map(
          ([t, n]) =>
            `<span class="chip"><b>${n}</b> ${TYPE[t][0].toLowerCase()}${n > 1 ? "s" : ""}</span>`
        )
        .join("")}
        ${state.i === chapters.length - 1 || c.epi ? `<span class="chip" title="Computed from role dates with overlaps merged; ${exp.all_roles_years} years including internships and teaching roles."><b>${exp.full_time_years}y</b> full-time experience</span>` : ""}</div>
      <div class="cards">${items.slice(0, lim).map(card).join("")}
        ${items.length > 5 ? `<button class="more" id="more">${state.expanded ? "Show fewer" : `Show all ${items.length}`}</button>` : ""}</div>`;
          meta
            .querySelectorAll(".card")
            .forEach((b) => (b.onclick = () => openDrawer(b.dataset.id)));
          const m = document.getElementById("more");
          if (m)
            m.onclick = () => {
              state.expanded = !state.expanded;
              renderMeta();
            };
        }
        function renderScrub() {
          const c = chapters[state.i];
          document.getElementById("fill").style.width = chapterX(c) + "%";
          chapters.forEach((x, k) => {
            x.node.classList.toggle("active", k === state.i);
            x.node.classList.toggle("past", k < state.i);
          });
          track.setAttribute("aria-valuetext", `${c.name} ${c.epi ? "" : Math.floor(c.from)}`);
          document.getElementById("prev").disabled = state.i === 0;
          document.getElementById("next").disabled = state.i === chapters.length - 1;
          root.style.setProperty("--hue", c.hue);
        }

        // Chapter change: one continuous movement out and in, shaped by the chosen transition.
        const stage = document.getElementById("stage");
        let busy = null;
        function go(i, dir) {
          i = Math.max(0, Math.min(chapters.length - 1, i));
          if (i === state.i && stage.dataset.ready) return;
          dir = dir ?? (Math.sign(i - state.i) || 1);
          const first = stage.dataset.ready;
          state.i = i;
          state.expanded = false;
          renderScrub();
          if (!first || reduce) {
            frameIdx = 0;
            renderMedia();
            renderMeta();
            stage.dataset.ready = 1;
            startCycle();
            return;
          }
          const K = {
            fade: [{ opacity: 1 }, { opacity: 0 }],
            slide: [
              { opacity: 1, transform: "translateX(0)" },
              { opacity: 0, transform: `translateX(${-60 * dir}px)` },
            ],
            zoom: [
              { opacity: 1, transform: "scale(1)", filter: "blur(0)" },
              { opacity: 0, transform: "scale(1.06)", filter: "blur(6px)" },
            ],
          }[state.trans];
          const IN = {
            fade: [{ opacity: 0 }, { opacity: 1 }],
            slide: [
              { opacity: 0, transform: `translateX(${60 * dir}px)` },
              { opacity: 1, transform: "translateX(0)" },
            ],
            zoom: [
              { opacity: 0, transform: "scale(.94)", filter: "blur(6px)" },
              { opacity: 1, transform: "scale(1)", filter: "blur(0)" },
            ],
          }[state.trans];
          const parts = [media, meta];
          parts.forEach((el, k) =>
            el.animate(K, {
              duration: 260,
              delay: k * 40,
              easing: "cubic-bezier(.4,0,1,1)",
              fill: "forwards",
            })
          );
          // Swap on a timer, not on animation.finished: a hidden or throttled tab may never finish the animation.
          clearTimeout(busy);
          busy = setTimeout(() => {
            frameIdx = 0;
            renderMedia();
            renderMeta();
            startCycle();
            parts.forEach((el, k) => {
              el.getAnimations().forEach((a) => a.cancel());
              el.animate(IN, {
                duration: 520,
                delay: k * 70,
                easing: "cubic-bezier(.2,.8,.2,1)",
                fill: "backwards",
              });
            });
            busy = null;
          }, 320);
        }
        document.getElementById("prev").onclick = () => go(state.i - 1, -1);
        document.getElementById("next").onclick = () => go(state.i + 1, 1);
        addEventListener("keydown", (e) => {
          if (document.body.classList.contains("open")) {
            if (e.key === "Escape") closeDrawer();
            return;
          }
          if (e.key === "ArrowRight") go(state.i + 1, 1);
          else if (e.key === "ArrowLeft") go(state.i - 1, -1);
        });

        // Drag along the track: the chapter under the pointer's year becomes active as you scrub.
        const handle = document.getElementById("handle"),
          pop = document.getElementById("yearpop");
        const atX = (x) => {
          const r = track.getBoundingClientRect();
          const p = Math.max(0, Math.min(1, (x - r.left) / r.width));
          return { p, y: minY + p * (maxY - minY) };
        };
        const nearest = (p) =>
          chapters.reduce(
            (b, c, k) =>
              Math.abs(chapterX(c) / 100 - p) < Math.abs(chapterX(chapters[b]) / 100 - p) ? k : b,
            0
          );
        let dragging = false,
          lastHit = -1;
        const move = (ev) => {
          const { p, y } = atX(ev.clientX);
          handle.style.left = pop.style.left = p * 100 + "%";
          pop.textContent = p > 0.985 ? "Beyond" : Math.floor(Math.min(y, NOW));
          const k = nearest(p);
          if (k !== lastHit) {
            lastHit = k;
            if (k !== state.i) go(k);
          }
        };
        track.addEventListener("pointerdown", (ev) => {
          dragging = true;
          lastHit = -1;
          track.setPointerCapture(ev.pointerId);
          track.classList.add("dragging");
          move(ev);
        });
        track.addEventListener("pointermove", (ev) => dragging && move(ev));
        const end = () => {
          dragging = false;
          track.classList.remove("dragging");
        };
        track.addEventListener("pointerup", end);
        track.addEventListener("pointercancel", end);

        // Swipe on the stage for phones.
        let sx = null;
        stage.addEventListener("touchstart", (e) => (sx = e.touches[0].clientX), { passive: true });
        stage.addEventListener("touchend", (e) => {
          if (sx == null) return;
          const dx = e.changedTouches[0].clientX - sx;
          if (Math.abs(dx) > 50) go(state.i + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
          sx = null;
        });

        // Detail drawer
        const drawerBody = document.getElementById("drawerBody");
        function openDrawer(id) {
          const e = byId[id],
            [tn, col] = TYPE[e.type] || [e.type, "var(--soft)"];
          const bullets = (e.resume_bullets || []).map((b) =>
            typeof b === "string" ? { text: b, verified: true } : b
          );
          const rel = (e.related || [])
            .map((r) => byId[r])
            .filter((x) => x && x.visibility !== "private");
          drawerBody.innerHTML = `
      <span class="kicker" style="color:${col}">${esc(tn)}${e.placeholder ? ' <span class="badge">Placeholder</span>' : ""}</span>
      <h2>${esc(e.title)}</h2>
      <p style="margin:0">${esc([e.org, e.location, span(e) || (e._inferred ? "about " + Math.floor(e._w) + " (from linked role)" : "")].filter(Boolean).join(" · "))}</p>
      ${e.summary ? `<h3>Summary</h3><p>${esc(e.summary)}</p>` : ""}
      ${e.body ? `<h3>Story</h3><p style="white-space:pre-line">${esc(e.body)}</p>` : ""}
      ${(e.metrics || []).length ? `<h3>Impact</h3>${e.metrics.map((m) => `<div class="metric"><b>${esc(m.value)}</b><small>${esc(m.meaning)}${m.verified === false ? '<span class="unv" title="Not found word-for-word in a source file yet">unverified</span>' : ""}</small></div>`).join("")}` : ""}
      ${bullets.length ? `<h3>Resume lines</h3><ul>${bullets.map((b) => `<li>${esc(b.text)}${b.verified === false ? '<span class="unv">unverified</span>' : ""}</li>`).join("")}</ul>` : ""}
      ${(e.skills || []).length ? `<h3>Skills</h3><div class="chips">${e.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div>` : ""}
      ${rel.length ? `<h3>Connected</h3><div class="cards">${rel.map(card).join("")}</div>` : ""}`;
          drawerBody
            .querySelectorAll(".card")
            .forEach((b) => (b.onclick = () => openDrawer(b.dataset.id)));
          document.body.classList.add("open");
          document.getElementById("drawer").focus();
        }
        const closeDrawer = () => document.body.classList.remove("open");
        document.getElementById("close").onclick = closeDrawer;
        document.getElementById("drawerBg").onclick = closeDrawer;

        state.i = -1;
        go(0);
        window.__timeline = {
          chapters: chapters.map((c) => ({ name: c.name, from: c.from, n: c.items.length })),
        };
      })();
    </script>
  </body>
</html>
